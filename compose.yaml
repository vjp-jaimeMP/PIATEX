
services:
  # Servidor web Nginx
  web:
    image: nginx:1.27-alpine
    container_name: novaharvest_web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Servidor PHP-FPM
  php:
    build: ./php
    container_name: novaharvest_php
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./php/php.ini:/usr/local/etc/php/php.ini:ro
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      - db

  # Servidor de base de datos MariaDB
  db:
    image: mariadb:11
    container_name: novaharvest_db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/novaharvest.sql:/docker-entrypoint-initdb.d/01-novaharvest.sql:ro

# Volumen persistente de MariaDB
volumes:
  dbdata:
