server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Página de error 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Página de error 500
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Compresión gzip
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json;

    # Archivos Markdown como texto
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
    }
}